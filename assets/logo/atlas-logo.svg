<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" role="img" aria-label="ATLAS CAE — Certificados de Ahorro Energético">
  <defs>
    <linearGradient id="wm-legs" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="wm-sphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49A"/>
      <stop offset="100%" stop-color="#1B9ED4"/>
    </linearGradient>
  </defs>
  <!-- Symbol mark (36x40 original, centered in 40px height) -->
  <line x1="3.5" y1="34" x2="17" y2="4.5" stroke="url(#wm-legs)" stroke-width="3.1" stroke-linecap="round"/>
  <line x1="30.5" y1="34" x2="17" y2="4.5" stroke="url(#wm-legs)" stroke-width="3.1" stroke-linecap="round"/>
  <line x1="9" y1="22" x2="25" y2="22" stroke="#00C49A" stroke-width="2.9" stroke-linecap="round"/>
  <line x1="2" y1="34" x2="32" y2="34" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17" cy="4.5" r="3.5" fill="url(#wm-sphere)"/>
  <circle cx="15.8" cy="3.3" r="1.15" fill="white" opacity="0.42"/>
  <!-- Vertical divider -->
  <line x1="46" y1="8" x2="46" y2="32" stroke="rgba(0,196,154,0.5)" stroke-width="1.2"/>
  <!-- ATLAS wordmark -->
  <text x="55" y="25"
    font-family="'Montserrat','Arial Black',Helvetica,sans-serif"
    font-size="17" font-weight="900"
    fill="#ffffff" letter-spacing="2.8"
    dominant-baseline="auto">ATLAS</text>
  <!-- Tagline -->
  <text x="56" y="34"
    font-family="'Montserrat',Helvetica,sans-serif"
    font-size="5.8" font-weight="600"
    fill="#00C49A" letter-spacing="1.5"
    dominant-baseline="auto">CERTIFICADOS DE AHORRO ENERGÉTICO</text>
</svg>
